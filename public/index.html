<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleepcall Pay — Katalog Talent Partner</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { pink: '#ec4899', purple: '#a855f7', dark: '#0f172a' } }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 relative overflow-x-hidden">

  <div class="fixed top-[-10%] left-[-10%] w-[350px] h-[350px] bg-pink-600/20 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[350px] h-[350px] bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>

  <main class="w-full max-w-md mx-auto my-auto space-y-5 z-10 py-6">
    
    <header class="text-center space-y-2">
      <div class="flex items-center justify-center gap-2">
        <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">
          Sleepcall Pay
        </h1>
        <i class="fa-solid fa-circle-check text-pink-500 text-sm"></i>
      </div>
      <p class="text-xs text-slate-400">Pilih Talent Partner Favoritmu 🌙</p>
    </header>

    <div class="flex items-center justify-between p-3.5 rounded-2xl glass-card border border-amber-500/30 bg-amber-500/5">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center">
          <i class="fa-solid fa-coins text-base"></i>
        </div>
        <div>
          <p class="text-xs font-bold text-white">Butuh Saldo Coin?</p>
          <p class="text-[10px] text-slate-400">Top-Up instan via QRIS Pakasir</p>
        </div>
      </div>
      <a href="topup.html" class="px-3.5 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs rounded-xl transition-all">
        Beli Coin
      </a>
    </div>

    <div class="flex p-1 bg-slate-900 border border-slate-800 rounded-xl text-xs font-semibold">
      <button onclick="filterTalent('all')" id="btn-all" class="flex-1 py-2 rounded-lg bg-pink-500 text-white transition-all">Semua</button>
      <button onclick="filterTalent('Perempuan')" id="btn-Perempuan" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition-all">Perempuan</button>
      <button onclick="filterTalent('Laki-laki')" id="btn-Laki-laki" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition-all">Laki-laki</button>
    </div>

    <section id="talentList" class="space-y-3.5">
      <p class="text-xs text-slate-500 text-center py-8">Memuat data talent dari server...</p>
    </section>

    <section class="space-y-2.5 pt-2">
      <a href="register.html"
         class="w-full flex items-center justify-between p-3.5 rounded-2xl glass-card border border-slate-800 hover:border-emerald-500/50 text-xs font-semibold transition-all">
        <span class="flex items-center gap-2.5">
          <i class="fa-solid fa-user-plus text-emerald-400"></i> Daftar Jadi Talent Partner
        </span>
        <i class="fa-solid fa-chevron-right text-slate-500"></i>
      </a>

      <a href="admin.html"
         class="w-full flex items-center justify-between p-3 rounded-2xl bg-slate-900/50 border border-slate-800/80 hover:border-pink-500/40 text-[11px] font-medium text-slate-400 transition-all">
        <span class="flex items-center gap-2">
          <i class="fa-solid fa-user-shield text-pink-400"></i> Login Portal Admin
        </span>
        <i class="fa-solid fa-lock text-[10px]"></i>
      </a>
    </section>

  </main>

  <footer class="text-center text-xs text-slate-500 py-4 z-10">
    <p>© 2026 Sleepcall Pay. All rights reserved.</p>
  </footer>

  <script>
    let allTalents = [];

    document.addEventListener("DOMContentLoaded", () => {
      fetch('/api/talents')
        .then(res => res.json())
        .then(data => {
          allTalents = data;
          renderTalents(data);
        })
        .catch(err => {
          console.error(err);
          document.getElementById("talentList").innerHTML = `<p class="text-xs text-red-400 text-center py-8">Gagal mengambil data dari database Turso.</p>`;
        });
    });

    function renderTalents(list) {
      const container = document.getElementById("talentList");
      container.innerHTML = "";

      if(list.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">Belum ada talent tersedia di database.</p>`;
        return;
      }

      list.forEach(t => {
        const isOnline = t.status === "Online";
        const statusBadge = isOnline 
          ? `<span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-md border border-emerald-500/20"><i class="fa-solid fa-circle text-[6px]"></i> Online</span>`
          : `<span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-md"><i class="fa-solid fa-circle text-[6px]"></i> Busy</span>`;

        const card = document.createElement("a");
        card.href = `talent.html?id=${t.id}`;
        card.className = "talent-card group block p-4 rounded-2xl glass-card border border-slate-800 hover:border-pink-500/50 hover:bg-slate-900/90 transition-all duration-300 hover:scale-[1.02]";
        card.innerHTML = `
          <div class="flex items-center space-x-3.5">
            <div class="relative w-14 h-14 rounded-full p-0.5 bg-gradient-to-tr from-pink-500 to-purple-500 flex-shrink-0">
              <img src="${t.avatar}" alt="${t.name}" class="w-full h-full object-cover rounded-full border border-slate-900">
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold text-slate-100 group-hover:text-pink-300 truncate">${t.name}</h2>
                ${statusBadge}
              </div>
              <p class="text-xs text-slate-400">${t.username} • ${t.age} thn</p>
              <div class="flex items-center gap-2 mt-1.5 text-[11px]">
                <span class="text-amber-400 font-bold"><i class="fa-solid fa-coins"></i> ${t.coins || 35} Coin/jam</span>
                <span class="text-slate-600">•</span>
                <span class="text-slate-400"><i class="fa-solid fa-star text-amber-400 text-xs"></i> ${t.rating || 5.0}</span>
              </div>
            </div>
            <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:text-pink-400 group-hover:translate-x-1 transition-all"></i>
          </div>
        `;
        container.appendChild(card);
      });

      gsap.fromTo(".talent-card", 
        { y: 20, opacity: 0 }, 
        { y: 0, opacity: 1, duration: 0.4, stagger: 0.08, ease: "power2.out" }
      );
    }

    function filterTalent(gender) {
      document.querySelectorAll("[id^='btn-']").forEach(btn => {
        btn.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition-all";
      });
      document.getElementById(`btn-${gender}`).className = "flex-1 py-2 rounded-lg bg-pink-500 text-white transition-all";

      const filtered = gender === 'all' ? allTalents : allTalents.filter(t => t.gender === gender);
      renderTalents(filtered);
    }
  </script>
</body>
</html>
