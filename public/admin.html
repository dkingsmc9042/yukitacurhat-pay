<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Sleepcall Pay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 relative">

  <div id="loginSection" class="w-full max-w-sm mx-auto my-auto py-12 space-y-4">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 bg-pink-500/20 text-pink-400 rounded-full flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <h1 class="text-xl font-extrabold text-white">Login Admin</h1>
      <p class="text-xs text-slate-400">Masuk untuk mengelola & verifikasi pendaftaran talent</p>
    </div>

    <form onsubmit="handleLogin(event)" class="glass-card border border-slate-800 rounded-3xl p-6 space-y-3.5 shadow-2xl">
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Username Admin</label>
        <input type="text" id="adminUser" required placeholder="admin" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-pink-500">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Password</label>
        <input type="password" id="adminPass" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-pink-500">
      </div>
      <p class="text-[11px] text-slate-500 text-center">Username: <b>admin</b> | Password: <b>admin123</b></p>
      <button type="submit" class="w-full py-2.5 bg-pink-500 hover:bg-pink-600 font-bold text-xs text-white rounded-xl transition-all">
        Masuk Dashboard <i class="fa-solid fa-right-to-bracket ml-1"></i>
      </button>
    </form>
  </div>

  <div id="dashboardSection" class="w-full max-w-3xl mx-auto space-y-6 hidden py-4">
    <div class="flex items-center justify-between glass-card border border-slate-800 p-4 rounded-2xl">
      <div>
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-gauge text-pink-500"></i> Admin Panel (Turso Connected)
        </h2>
        <p class="text-xs text-slate-400">Persetujuan Talent, Audio Suara & Sistem Coin</p>
      </div>
      <button onclick="handleLogout()" class="px-3 py-1.5 bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg text-xs font-semibold">
        Logout <i class="fa-solid fa-right-from-bracket ml-1"></i>
      </button>
    </div>

    <div class="flex p-1 bg-slate-900 border border-slate-800 rounded-xl text-xs font-semibold">
      <button onclick="switchTab('requests')" id="tab-requests" class="flex-1 py-2.5 rounded-lg bg-pink-500 text-white">
        <i class="fa-solid fa-clock-rotate-left mr-1"></i> Permintaan Masuk (<span id="reqCount">0</span>)
      </button>
      <button onclick="switchTab('activeTalents')" id="tab-activeTalents" class="flex-1 py-2.5 rounded-lg text-slate-400">
        <i class="fa-solid fa-users mr-1"></i> Data Talent Tayang
      </button>
    </div>

    <div id="view-requests" class="space-y-4">
      <div id="requestList" class="space-y-3"></div>
    </div>

    <div id="view-activeTalents" class="space-y-3 hidden">
      <div id="activeList" class="space-y-3"></div>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      if(document.getElementById("adminUser").value === "admin" && document.getElementById("adminPass").value === "admin123") {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("dashboardSection").classList.remove("hidden");
        loadDashboardData();
      } else {
        alert("Username/Password Admin Salah!");
      }
    }

    function handleLogout() {
      document.getElementById("loginSection").classList.remove("hidden");
      document.getElementById("dashboardSection").classList.add("hidden");
    }

    function switchTab(tab) {
      ['requests', 'activeTalents'].forEach(t => {
        document.getElementById('view-' + t).classList.add('hidden');
        document.getElementById('tab-' + t).className = "flex-1 py-2.5 rounded-lg text-slate-400 hover:text-white transition-all";
      });
      document.getElementById('view-' + tab).classList.remove('hidden');
      document.getElementById('tab-' + tab).className = "flex-1 py-2.5 rounded-lg bg-pink-500 text-white transition-all";
    }

    async function loadDashboardData() {
      const reqRes = await fetch('/api/requests');
      const reqs = await reqRes.json();
      document.getElementById("reqCount").innerText = reqs.length;
      
      const reqContainer = document.getElementById("requestList");
      reqContainer.innerHTML = reqs.length === 0 ? `<p class="text-xs text-slate-500 text-center py-6">Belum ada pengajuan pendaftaran baru.</p>` : "";

      reqs.forEach(r => {
        const item = document.createElement("div");
        item.className = "glass-card border border-slate-800 rounded-2xl p-4 flex flex-col md:flex-row items-start justify-between gap-4";
        item.innerHTML = `
          <div class="flex items-start space-x-3.5">
            <img src="${r.avatar}" class="w-16 h-16 object-cover rounded-2xl border border-slate-700 flex-shrink-0">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <h4 class="text-sm font-bold text-white">${r.name}</h4>
                <span class="text-[10px] bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded-md">${r.gender}, ${r.age}th</span>
              </div>
              <p class="text-xs text-slate-400">${r.username} • Request Tarif: <b class="text-amber-400"><i class="fa-solid fa-coins"></i> ${r.requestedCoins} Coin/jam</b></p>
              <p class="text-xs text-slate-300 italic">"${r.bio}"</p>
              
              <div class="pt-2">
                <p class="text-[10px] font-semibold text-pink-400 mb-1"><i class="fa-solid fa-microphone"></i> Sampel Voice Talent:</p>
                <audio controls class="h-8 w-60">
                  <source src="${r.voiceUrl}" type="audio/mpeg">
                </audio>
              </div>
            </div>
          </div>
          <div class="flex md:flex-col gap-2 flex-shrink-0 w-full md:w-auto">
            <button onclick="processRequest('approve', '${r.id}')" class="flex-1 px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-xs font-bold transition-all">
              <i class="fa-solid fa-check"></i> ACC & Tayangkan
            </button>
            <button onclick="processRequest('reject', '${r.id}')" class="flex-1 px-3 py-2 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded-xl text-xs font-bold transition-all">
              <i class="fa-solid fa-xmark"></i> Tolak
            </button>
          </div>
        `;
        reqContainer.appendChild(item);
      });

      const talRes = await fetch('/api/talents');
      const talents = await talRes.json();
      const activeContainer = document.getElementById("activeList");
      activeContainer.innerHTML = talents.length === 0 ? `<p class="text-xs text-slate-500 text-center py-6">Belum ada talent aktif di database.</p>` : "";

      talents.forEach(t => {
        const item = document.createElement("div");
        item.className = "glass-card border border-slate-800 rounded-xl p-3 flex items-center justify-between";
        item.innerHTML = `
          <div class="flex items-center space-x-3">
            <img src="${t.avatar}" class="w-10 h-10 object-cover rounded-full">
            <div>
              <h5 class="text-xs font-bold text-white">${t.name}</h5>
              <p class="text-[11px] text-amber-400 font-semibold"><i class="fa-solid fa-coins"></i> ${t.coins} Coin/jam</p>
            </div>
          </div>
          <button onclick="processRequest('delete', '${t.id}')" class="text-xs text-red-400 hover:text-red-300 p-2">
            <i class="fa-solid fa-trash"></i>
          </button>
        `;
        activeContainer.appendChild(item);
      });
    }

    async function processRequest(action, id) {
      if (action === 'delete' && !confirm("Hapus talent ini dari database Turso?")) return;

      const res = await fetch('/api/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, id })
      });

      if (res.ok) {
        loadDashboardData();
      } else {
        alert("Gagal memproses tindakan.");
      }
    }
  </script>
</body>
</html>
