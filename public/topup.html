<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beli Coin — Sleepcall Pay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 relative">

  <div class="fixed top-[-10%] left-[-10%] w-[350px] h-[350px] bg-amber-600/10 rounded-full blur-[120px] pointer-events-none"></div>

  <main class="w-full max-w-md mx-auto my-auto space-y-5 z-10 py-6">
    <div class="flex items-center justify-between">
      <a href="index.html" class="w-9 h-9 rounded-full glass-card border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </a>
      <span class="text-xs font-semibold text-slate-400">Top-Up Saldo Coin</span>
      <div class="w-9"></div>
    </div>

    <div class="text-center space-y-1">
      <div class="w-12 h-12 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-coins"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-white">Deposit Coin</h1>
      <p class="text-xs text-slate-400">Pilih nominal coin untuk sewa partner pilihanmu 🌙</p>
    </div>

    <div class="space-y-3">
      <label class="text-xs font-semibold text-slate-300 block">Nomor WhatsApp Kamu</label>
      <input type="tel" id="userPhone" required placeholder="081234567890" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 mb-2">

      <label class="text-xs font-semibold text-slate-300 block">Pilih Paket Coin</label>
      
      <div class="grid grid-cols-2 gap-3">
        <button onclick="selectPackage(50, 50000, this)" class="pkg-card p-4 rounded-2xl glass-card border border-slate-800 hover:border-amber-500 text-left space-y-1 transition-all">
          <span class="text-xs text-slate-400 font-medium">Starter</span>
          <p class="text-lg font-black text-amber-400"><i class="fa-solid fa-coins"></i> 50 Coin</p>
          <p class="text-xs font-semibold text-white">Rp 50.000</p>
        </button>

        <button onclick="selectPackage(100, 95000, this)" class="pkg-card p-4 rounded-2xl glass-card border border-slate-800 hover:border-amber-500 text-left space-y-1 transition-all">
          <span class="text-xs text-slate-400 font-medium">Popular</span>
          <p class="text-lg font-black text-amber-400"><i class="fa-solid fa-coins"></i> 100 Coin</p>
          <p class="text-xs font-semibold text-white">Rp 95.000</p>
        </button>

        <button onclick="selectPackage(200, 180000, this)" class="pkg-card p-4 rounded-2xl glass-card border border-slate-800 hover:border-amber-500 text-left space-y-1 transition-all">
          <span class="text-xs text-slate-400 font-medium">Pro</span>
          <p class="text-lg font-black text-amber-400"><i class="fa-solid fa-coins"></i> 200 Coin</p>
          <p class="text-xs font-semibold text-white">Rp 180.000</p>
        </button>

        <button onclick="selectPackage(500, 425000, this)" class="pkg-card p-4 rounded-2xl glass-card border border-slate-800 hover:border-amber-500 text-left space-y-1 transition-all">
          <span class="text-xs text-slate-400 font-medium">VIP Night</span>
          <p class="text-lg font-black text-amber-400"><i class="fa-solid fa-coins"></i> 500 Coin</p>
          <p class="text-xs font-semibold text-white">Rp 425.000</p>
        </button>
      </div>

      <button id="btnPay" onclick="processDeposit()" disabled class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-orange-600 font-bold text-xs text-slate-950 rounded-2xl shadow-lg shadow-amber-500/20 transition-all opacity-50 cursor-not-allowed mt-4">
        Bayar via QRIS / Pakasir <i class="fa-solid fa-qrcode ml-1"></i>
      </button>
    </div>
  </main>

  <script>
    let selectedCoins = 0;
    let selectedAmount = 0;

    function selectPackage(coins, amount, el) {
      selectedCoins = coins;
      selectedAmount = amount;

      document.querySelectorAll('.pkg-card').forEach(c => c.classList.remove('border-amber-500', 'bg-amber-500/10'));
      el.classList.add('border-amber-500', 'bg-amber-500/10');

      const btn = document.getElementById('btnPay');
      btn.disabled = false;
      btn.classList.remove('opacity-50', 'cursor-not-allowed');
    }

    async function processDeposit() {
      const phone = document.getElementById('userPhone').value;
      if (!phone) {
        alert("Masukkan nomor WhatsApp untuk konfirmasi transaksi.");
        return;
      }

      const btn = document.getElementById('btnPay');
      btn.innerText = "Membuat Invoice...";
      btn.disabled = true;

      try {
        const res = await fetch('/api/deposit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, coins: selectedCoins, amount: selectedAmount })
        });

        const data = await res.json();
        if (data.success && data.paymentUrl) {
          window.location.href = data.paymentUrl;
        } else {
          alert("Gagal memproses pembayaran. Periksa API Key Pakasir.");
        }
      } catch (err) {
        alert("Terjadi kesalahan jaringan.");
      } finally {
        btn.innerText = "Bayar via QRIS / Pakasir";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
