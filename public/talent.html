<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Talent — Sleepcall Pay</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { pink: '#ec4899', purple: '#a855f7', dark: '#0f172a' } }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 relative overflow-x-hidden">

  <div class="fixed top-[-10%] left-[-10%] w-[350px] h-[350px] bg-pink-600/20 rounded-full blur-[120px] pointer-events-none"></div>

  <main class="w-full max-w-md mx-auto my-auto space-y-5 z-10 py-4">
    
    <div class="flex items-center justify-between">
      <a href="index.html" class="w-9 h-9 rounded-full glass-card border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white hover:border-pink-500/40 transition-all">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </a>
      <span class="text-xs font-semibold text-slate-400">Profil Partner</span>
      <div class="w-9"></div>
    </div>

    <div id="talentDetail" class="space-y-4">
      <div class="text-center py-12 text-slate-500 text-xs">Memuat profil talent...</div>
    </div>

  </main>

  <footer class="text-center text-xs text-slate-500 py-4 z-10">
    <p>© 2026 Sleepcall Pay. All rights reserved.</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const talentId = urlParams.get('id');

      fetch('/api/talents')
        .then(res => res.json())
        .then(talents => {
          const talent = talents.find(t => t.id === talentId) || talents[0];
          renderProfile(talent);
        });
    });

    function renderProfile(t) {
      const detailContainer = document.getElementById("talentDetail");

      if (!t) {
        detailContainer.innerHTML = `<p class="text-xs text-slate-500 text-center">Talent tidak ditemukan.</p>`;
        return;
      }

      detailContainer.innerHTML = `
        <div class="text-center space-y-3">
          <div class="relative w-28 h-28 mx-auto">
            <div class="w-full h-full rounded-full p-1 bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500">
              <img src="${t.avatar}" alt="${t.name}" class="w-full h-full object-cover rounded-full border-2 border-slate-900">
            </div>
            <span class="absolute bottom-1 right-1 w-5 h-5 bg-emerald-500 border-2 border-slate-950 rounded-full"></span>
          </div>

          <div>
            <h1 class="text-xl font-extrabold text-white">${t.name}</h1>
            <p class="text-xs text-slate-400 mt-0.5">${t.username} • ${t.age} Tahun • ${t.gender}</p>
          </div>

          <div class="flex items-center justify-center gap-3 text-xs font-semibold">
            <span class="px-3 py-1 rounded-lg glass-card border border-slate-800 text-amber-400">
              <i class="fa-solid fa-star"></i> ${t.rating || 5.0} / 5.0
            </span>
            <span class="px-3 py-1 rounded-lg glass-card border border-slate-800 text-pink-400">
              <i class="fa-solid fa-coins"></i> ${t.coins || 35} Coin
            </span>
          </div>
        </div>

        ${t.voiceUrl ? `
        <div class="p-4 rounded-2xl glass-card border border-slate-800 space-y-2">
          <h3 class="text-xs font-bold text-pink-400 flex items-center gap-1.5">
            <i class="fa-solid fa-microphone"></i> Dengarkan Suara ${t.name.split(' ')[0]}
          </h3>
          <audio controls class="w-full h-9 pt-1">
            <source src="${t.voiceUrl}" type="audio/mpeg">
            Browser kamu tidak mendukung pemutaran audio.
          </audio>
        </div>
        ` : ''}

        <div class="p-4 rounded-2xl glass-card border border-slate-800 space-y-1">
          <h3 class="text-xs font-bold text-slate-300">Tentang Saya</h3>
          <p class="text-xs text-slate-400 leading-relaxed">${t.bio}</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="p-3.5 rounded-2xl glass-card border border-slate-800 text-center space-y-1">
            <span class="text-[11px] font-semibold text-pink-400">Sleep Call</span>
            <p class="text-sm font-extrabold text-white">${t.coins || 35} Coin / jam</p>
          </div>
          <div class="p-3.5 rounded-2xl glass-card border border-slate-800 text-center space-y-1">
            <span class="text-[11px] font-semibold text-purple-400">Teman Curhat</span>
            <p class="text-sm font-extrabold text-white">${Math.round((t.coins || 35) * 0.7)} Coin / hari</p>
          </div>
        </div>

        <a href="https://wa.me/6281234567890?text=Halo%20Admin,%20saya%20mau%20booking%20talent%20${encodeURIComponent(t.name)}%20(${t.username})%20dengan%20tarif%20${t.coins || 35}%20Coin" target="_blank"
           class="w-full flex items-center justify-center gap-2 py-3.5 px-4 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 font-bold text-xs text-white rounded-2xl shadow-lg shadow-pink-500/25 transition-all active:scale-[0.98]">
          <i class="fa-brands fa-whatsapp text-lg"></i> Booking ${t.name.split(' ')[0]} Sekarang
        </a>
      `;

      gsap.from("#talentDetail > *", {
        duration: 0.5,
        y: 20,
        opacity: 0,
        stagger: 0.08,
        ease: "power2.out"
      });
    }
  </script>
</body>
</html>
